name: Web quality gates

on:
  pull_request:
    branches:
      - preview
      - main

concurrency:
  group: web-quality-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  patch-whitespace:
    name: Validate submitted patch whitespace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate pull-request diff against its actual base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --check "$BASE_SHA...$HEAD_SHA"

  web:
    name: Web build, audit, and browser regression
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=moderate
      - run: npx tsc --noEmit --project tsconfig.json
      - run: npm run validate:rdma-curriculum
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm start > /tmp/fabriclab-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/practical/rdma >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fabriclab-next.log
          exit 1
      - env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:browser:public
      - env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:browser:ch16
      - env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/rdma.curriculum.smoke.spec.ts --workers=1
      - env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/rdma.practical.smoke.spec.ts --workers=1
      - env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/rdma.correlations.spec.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-regression
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  rdma-evidence:
    name: RDMA evidence validation and deterministic export
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - run: python3 -m venv /tmp/rdma-export-venv
      - run: /tmp/rdma-export-venv/bin/pip install -r labs/rdma-basics/requirements-export.txt
      - working-directory: labs/rdma-basics
        run: /tmp/rdma-export-venv/bin/python -m compileall -q python scripts tests
      - working-directory: labs/rdma-basics
        run: /tmp/rdma-export-venv/bin/python -m unittest discover -s tests -v
      - working-directory: labs/rdma-basics
        run: |
          ./scripts/validate-evidence.sh evidence/reference-run --verify-checksums
          cd evidence/reference-run
          sha256sum -c SHA256SUMS
      - run: |
          /tmp/rdma-export-venv/bin/python labs/rdma-basics/scripts/export_browser_evidence.py --output /tmp/rdma-evidence-check.json --no-copy-assets
          cmp /tmp/rdma-evidence-check.json apps/web/public/practical/rdma/reference-evidence.json
