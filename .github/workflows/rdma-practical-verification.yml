name: RDMA practical verification

on:
  pull_request:
    branches:
      - feat/rdma-runtime-recovery
      - preview
      - main
  push:
    branches:
      - feat/rdma-practical-frontend

concurrency:
  group: rdma-practical-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  patch-whitespace:
    name: Validate submitted patch whitespace
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete patch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pull-request diff against its actual base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Validate every new commit in a branch push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Cannot identify the previous branch commit for push whitespace validation" >&2
            exit 1
          fi
          git cat-file -e "$BEFORE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git rev-list --reverse "$BEFORE_SHA..$HEAD_SHA" | while read -r commit; do
            echo "checking $commit"
            git diff --check "$commit^" "$commit"
          done

  evidence-pipeline:
    name: Evidence pipeline in a shallow checkout
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository with default shallow history
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install packet-analysis dependency
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Create isolated exporter Python environment
        run: python3 -m venv /tmp/rdma-export-venv

      - name: Install pinned exporter validation dependency
        run: /tmp/rdma-export-venv/bin/pip install -r labs/rdma-basics/requirements-export.txt

      - name: Compile RDMA Python sources
        working-directory: labs/rdma-basics
        run: /tmp/rdma-export-venv/bin/python -m compileall -q python scripts tests

      - name: Run RDMA evidence and exporter regression tests
        working-directory: labs/rdma-basics
        run: /tmp/rdma-export-venv/bin/python -m unittest discover -s tests -v

      - name: Validate reference evidence and checksums
        working-directory: labs/rdma-basics
        run: |
          ./scripts/validate-evidence.sh evidence/reference-run --verify-checksums
          cd evidence/reference-run
          sha256sum -c SHA256SUMS

      - name: Verify deterministic browser evidence in shallow checkout
        run: |
          /tmp/rdma-export-venv/bin/python labs/rdma-basics/scripts/export_browser_evidence.py \
            --output /tmp/rdma-evidence-check.json \
            --no-copy-assets
          cmp /tmp/rdma-evidence-check.json apps/web/public/practical/rdma/reference-evidence.json

  practical-frontend:
    name: RDMA practical frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies deterministically
        run: npm ci

      - name: Type-check TypeScript
        run: npx tsc --noEmit --project tsconfig.json

      - name: Build production application
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm start > /tmp/fabriclab-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/practical/rdma >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fabriclab-next.log
          exit 1

      - name: Run RDMA practical browser regression tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/rdma.practical.smoke.spec.ts --workers=1

      - name: Run pure evidence-correlation tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/rdma.correlations.spec.ts --workers=1

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rdma-practical-playwright
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
